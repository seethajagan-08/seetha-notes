<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Collection Tracker</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1d2a24;--mute:#66736c;--line:#dfe4dd;--accent:#1f6f50;--accent-ink:#fff;--bad:#b3392b}
@media (prefers-color-scheme:dark){:root{--bg:#121714;--card:#1b2420;--ink:#e8eee9;--mute:#93a39a;--line:#2d3a34;--accent:#4fb98a;--accent-ink:#0c1a13;--bad:#ef8a7c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:920px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px}
p.sub{margin:0 0 20px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--mute)}
label.wide{grid-column:1/-1}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:6px;padding:9px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.6;cursor:wait}
.actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.totals{display:flex;gap:12px;flex-wrap:wrap}
.totals div{flex:1 1 140px}
.totals span{display:block;font-size:.85rem;color:var(--mute)}
.totals strong{font-size:1.3rem}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.85rem;color:var(--mute);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td button{padding:3px 9px;color:var(--bad)}
.empty{color:var(--mute);padding:12px 8px}
.msg{font-size:.9rem;color:var(--mute);min-height:1.3em;margin:6px 0 0}
.msg.ok{color:var(--accent)}.msg.err{color:var(--bad)}
#lock{display:none}
</style>
</head>
<body>
<main>
  <h1>Daily collection tracker</h1>
  <p class="sub">Entries are saved to your online database, so you can open this from any device.</p>

  <section class="card" id="lock">
    <form id="lf">
      <label class="wide">Password <input type="password" id="pw" autocomplete="current-password" required></label>
      <div class="actions"><button class="primary" type="submit">Unlock</button></div>
    </form>
    <p class="msg err" id="lmsg"></p>
  </section>

  <div id="app" style="display:none">
    <section class="card">
      <form id="f">
        <label>Date <input type="date" id="date" required></label>
        <label>Daily collection <input type="number" id="coll" min="0" step="0.01" required placeholder="0.00"></label>
        <label>Spent <input type="number" id="spent" min="0" step="0.01" required placeholder="0.00"></label>
        <label>Time spent (hours) <input type="number" id="time" min="0" step="0.25" placeholder="0"></label>
        <label class="wide">Notes <textarea id="notes" rows="2" placeholder="Anything worth remembering"></textarea></label>
        <div class="actions"><button class="primary" type="submit" id="add">Add entry</button><button type="button" id="lockbtn">Lock</button></div>
      </form>
      <p class="msg" id="msg"></p>
    </section>

    <section class="card totals">
      <div><span>Total collection</span><strong id="tc">0.00</strong></div>
      <div><span>Total spent</span><strong id="ts">0.00</strong></div>
      <div><span>Net</span><strong id="tn">0.00</strong></div>
      <div><span>Total hours</span><strong id="tt">0</strong></div>
    </section>

    <section class="card">
      <div class="scroll">
        <table>
          <thead><tr><th>Date</th><th class="n">Collection</th><th class="n">Spent</th><th class="n">Net</th><th class="n">Hours</th><th>Notes</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="empty">No entries yet. Add your first one above.</div>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
let pw = "", entries = [];

function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function recall(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
function say(t, cls) { $("msg").textContent = t; $("msg").className = "msg " + (cls || ""); }

async function api(method, path, body) {
  const r = await fetch("/api/entries" + (path || ""), {
    method,
    headers: {"Content-Type": "application/json", "x-password": pw},
    body: body ? JSON.stringify(body) : undefined
  });
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error(j.error || "Request failed (" + r.status + ")."); err.status = r.status; throw err; }
  return j;
}

function render() {
  const tb = $("rows"); tb.innerHTML = "";
  let c = 0, s = 0, t = 0;
  entries.forEach(e => {
    c += e.daily_collection; s += e.spent; t += e.time_spent;
    const tr = document.createElement("tr");
    [e.date, fmt(e.daily_collection), fmt(e.spent), fmt(e.daily_collection - e.spent), e.time_spent, e.notes].forEach((v, k) => {
      const td = document.createElement("td");
      if (k >= 1 && k <= 4) td.className = "n";
      td.textContent = v; tr.appendChild(td);
    });
    const td = document.createElement("td"), b = document.createElement("button");
    b.textContent = "Delete";
    b.onclick = async () => {
      if (!confirm("Delete this entry permanently?")) return;
      try { await api("DELETE", "?id=" + encodeURIComponent(e.id)); await refresh(); say("Entry deleted.", "ok"); }
      catch (err) { say(err.message, "err"); }
    };
    td.appendChild(b); tr.appendChild(td); tb.appendChild(tr);
  });
  $("tc").textContent = fmt(c); $("ts").textContent = fmt(s); $("tn").textContent = fmt(c - s); $("tt").textContent = t;
  $("empty").style.display = entries.length ? "none" : "block";
}

async function refresh() { entries = await api("GET"); render(); }

function showLock(msg) {
  $("app").style.display = "none"; $("lock").style.display = "block";
  $("lmsg").textContent = msg || ""; $("pw").value = ""; $("pw").focus();
}
async function unlock(p) {
  pw = p;
  try {
    await refresh();
    store("tracker_pw", p);
    $("lock").style.display = "none"; $("app").style.display = "block";
  } catch (err) {
    store("tracker_pw", null);
    showLock(err.message);
  }
}

$("lf").addEventListener("submit", ev => { ev.preventDefault(); unlock($("pw").value); });
$("lockbtn").onclick = () => { store("tracker_pw", null); pw = ""; showLock(""); };

$("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = $("add"); btn.disabled = true; say("Saving…");
  try {
    await api("POST", "", {
      date: $("date").value,
      daily_collection: parseFloat($("coll").value) || 0,
      spent: parseFloat($("spent").value) || 0,
      time_spent: parseFloat($("time").value) || 0,
      notes: $("notes").value.trim()
    });
    await refresh();
    $("coll").value = ""; $("spent").value = ""; $("time").value = ""; $("notes").value = "";
    say("Entry saved.", "ok"); $("coll").focus();
  } catch (err) {
    if (err.status === 401) showLock(err.message); else say(err.message, "err");
  }
  btn.disabled = false;
});

$("date").value = new Date().toISOString().slice(0, 10);
const saved = recall("tracker_pw");
if (saved) unlock(saved); else showLock("");
</script>
</body>
</html>
